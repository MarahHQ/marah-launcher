id = "emu-lichii"
kind = "emulator"
# The plugin is shown by the console it plays.
name = "Switch"
# The program the plugin installs and runs. Sentences about the program name it.
emulator = "Lichii"
version = "0.1.0"
host_api = "^0.7"
# The official build this plugin installs: the Linux AppImage, or the macOS or Windows zip.
# Lichii has no Intel Mac build: there Install says so, and your own build still runs.
platforms = ["linux", "macos", "windows"]
# The console it plays: it gets that console's catalog (switch.json).
console = "Switch"
capabilities = ["catalog", "downloader", "installer", "configurator", "launcher", "slots", "game_installer", "backup"]
# What the install sheet says this emulator installs from.
install_note = "Installs a Switch game from its game files (.nsp, .nsz, .xci, .xcz, .nup), with its update and DLC files, into the Switch folder of your game folders. A solid .nsz, which Lichii can't play, becomes the .nsp it was made from. Import the Switch firmware and keys from their archive in the Switch firmware and keys block on Lichii's page."

[permissions]
# GitHub's API, release downloads and the CDN they redirect to.
network = ["api.github.com", "github.com", "*.githubusercontent.com"]
# The AppImage is unpacked once, so running it needs no FUSE.
# The host runs the downloaded AppImage once, to unpack it.
# On macOS, the programs in Lichii's app; on Windows, those at the zip's top.
# Your own build: in the folder you map as lichii-build, or on your PATH.
process = [
    "builds/*/squashfs-root/AppRun",
    # Games start in Lichii's command-line program, with Marah Launcher's settings file (-c).
    "builds/*/squashfs-root/usr/bin/eden-cli",
    "builds/*/*.AppImage",
    "builds/*/lichii.app/Contents/MacOS/lichii",
    "builds/*/lichii.app/Contents/MacOS/eden-cli",
    "builds/*/lichii.exe",
    "builds/*/eden-cli.exe",
    "folder:lichii-build",
    "system:lichii",
]

# The player's game folders, shared with other emulators (the host's default is ~/Games).
# Switch game files are found anywhere in them; installs go to Switch/ in the first one.
[[permissions.filesystem]]
folder = "games"
write = true

# Switch game files to install, in its Switch folder, and downloads of Switch releases. Read only.
[[permissions.filesystem]]
folder = "packages"

# Lichii's own settings file, as its window saves it (qt-config.ini): games Marah Launcher starts with an
# official build start with it, with airplane mode as set in Marah Launcher and players 1 to 4 on the
# controllers you have (see src/config.rs). Your own build and Lichii's window read it alone.
# Read only; a restore from Settings → Backup writes it, as the host.
[[permissions.filesystem]]
folder = "lichii-config"
default = "~/.config/lichii"
default_on = { windows = "~/AppData/Roaming/lichii/config" }
title = "Lichii settings"
after = "own_build"

# Lichii's data folder: keys, firmware, saves and mods, which every Lichii build shares. The
# host writes the firmware (nand/system) and the keys of the same version (keys) when the player
# imports their archive ([system_files]). Settings → Backup saves the folder, and a restore writes
# it, as the host. From build-150 on, Lichii keeps its own folders, in place of Eden's
# (~/.local/share/eden): its window imports Eden's data once, and eden-cli starts no game until
# then.
[[permissions.filesystem]]
folder = "lichii-data"
write = true
default = "~/.local/share/lichii"
default_on = { windows = "~/AppData/Roaming/lichii" }
title = "Lichii data"
after = "own_build"

# A Lichii you built or installed yourself. Read only.
[[permissions.filesystem]]
folder = "lichii-build"
title = "Your own Lichii build"
after = "own_build"

# The system its games show under: what the Library and a card call it, and its color.
# Its id is the catalog's console, upper case.
[system]
id = "SWITCH"
name = "Nintendo Switch"
# The system's pictures, in assets/ (made by scripts/make-system-art.sh).
icon = "icon.png"
cover = "cover.jpg"
color = "#e60012"

# The Switch firmware and the keys of the same version, which the player imports from one
# archive on the emulator's page: see docs/players/emulators.md, "System files". Both replace
# their folders whole, so two versions never mix.
[system_files]
name = "Switch firmware and keys"
archive = "switch-firmware-keys.zip"

[[system_files.part]]
from = "firmware"
folder = "lichii-data"
into = "nand/system/Contents/registered"
files = ["*.nca"]
replace = true

[[system_files.part]]
from = "keys"
folder = "lichii-data"
into = "keys"
files = ["prod.keys", "title.keys"]
required = ["prod.keys"]
replace = true
