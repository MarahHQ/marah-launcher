id = "classic"
kind = "theme"
name = "Classic"
version = "0.3.0"
host_api = "^0.5"
capabilities = ["theme"]
activation = "eager"

# The built-in Classic theme: a hero and a row of game tiles on Home, on the theme contract.
# Every value is laid out on a 1920×1080 canvas and scaled to the window.
[theme]
ui_api = "^0.8"
input = ["gamepad", "pointer"]
navigation = "focus"

[[theme.breakpoints]]
name = "compact"
max_width = 900

[[theme.breakpoints]]
name = "regular"

[theme.assets]
fonts = [
    "fonts/Inter-Regular.ttf",
    "fonts/Inter-Medium.ttf",
    "fonts/Inter-SemiBold.ttf",
    "fonts/Inter-Bold.ttf",
    "fonts/Tajawal-Regular.ttf",
    "fonts/Tajawal-Bold.ttf",
]

[theme.assets.images]
# The Marah Launcher emblem (assets/logo.svg in the repository, drawn at 512 px).
logo = "images/logo.png"
# The mark alone, the gamepad (assets/logo-mark-static.svg, drawn at 512 px): the loading
# screen and Settings.
logo-mark = "images/logo-mark.png"

# select, back, error and start are made by scripts/make-sounds.py.
[theme.assets.sounds]
move = "sounds/move.wav"
select = "sounds/select.wav"
back = "sounds/back.wav"
error = "sounds/error.wav"
start = "sounds/start.wav"

[theme.tokens]
# Every token, each set to its default value.
color-bg = "#05070f"
color-surface = "#121a31"
color-surface-raised = "#1a2440"
color-text = "#f5f7fb"
color-text-muted = "#b9c3da"
color-accent = "#0a6cff"
color-focus = "#ffffff"
color-success = "#3ddc97"
color-warning = "#ffb547"
color-danger = "#ff5a6a"
color-info = "#7ab4ff"
color-overlay = "#03050ccc"
color-panel = "#0b1020"
color-text-faint = "#7d88a3"
color-on-focus = "#0a0d18"
color-accent-soft = "#8dbaff"
color-caution = "#ffd24d"
color-tint = "#ffffff"
color-shade = "#000000"
font-family = "Inter"
font-size-m = 19
motion-fast = 90
motion-normal = 150
motion-slow = 220
layout-direction = "ltr"

# Hidden for now: the right-to-left layout is not finished, so Settings does not offer it.
[theme.options.direction]
label = "Layout direction"
hidden = true
type = "choice"
default = "ltr"

[theme.options.direction.choices.ltr]
layout-direction = "ltr"

[theme.options.direction.choices.rtl]
layout-direction = "rtl"

# "off" turns the transitions into cuts.
