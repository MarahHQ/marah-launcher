id = "system"
# A system plugin: the machine's settings and devices, through the system's own tools.
kind = "system"
name = "This PC"
version = "0.1.0"
host_api = "^0.7"
platforms = ["linux", "macos", "windows"]
# Linux's. Each OS keeps the areas in its own module's AREAS table (src/linux.rs, macos.rs,
# windows.rs): on macOS and Windows all but os_updates and os_install.
capabilities = ["network", "vpn", "bluetooth", "audio", "power", "os_updates", "os_install", "drives"]

[permissions]
# NetworkManager, BlueZ, PipeWire's sound tools, systemd, rpm-ostree (Marah OS's updates),
# the Marah OS USB stick's installer, UDisks with lsblk for the drives, Windows' restart and
# shut down, and macOS's own tools: pmset for the battery, diskutil for the drives,
# networksetup and scutil for the network, system_profiler for Bluetooth, and
# osascript for the sound and for restart and shut down.
# udisksctl isn't in `polkit`: it runs as the player, and the UDisks service asks polkit itself.
process = [
    "system:nmcli",
    "system:bluetoothctl",
    "system:pactl",
    "system:systemctl",
    "system:rpm-ostree",
    "system:marah-os-install",
    "system:pmset",
    "system:lsblk",
    "system:udisksctl",
    "system:shutdown",
    "system:diskutil",
    "system:networksetup",
    "system:scutil",
    "system:system_profiler",
    "system:osascript",
]
# Joining a network, scanning, pairing, installing and unmounting take longer than a quick
# read, and an action's exit code and errors come with a streamed run.
long_running = [
    "system:nmcli",
    "system:bluetoothctl",
    "system:pactl",
    "system:systemctl",
    "system:marah-os-install",
    "system:udisksctl",
    "system:shutdown",
    "system:diskutil",
    "system:networksetup",
    "system:osascript",
]
# Installing Marah OS erases a disk: the installer runs as the administrator, which the USB
# stick's polkit rule allows for its player.
polkit = ["system:marah-os-install"]
