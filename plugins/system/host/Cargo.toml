[package]
name = "system-host"
description = "The machine's own settings: network and Wi-Fi, VPNs, Bluetooth, sound, power and battery, and Marah OS's updates and installer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
launcher-api.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows' own calls for the areas there (src/windows.rs): only the parts it calls.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_System_Com",
    "Win32_System_Power",
] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
