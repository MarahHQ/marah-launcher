# The Marah Launcher session's settings (/usr/bin/marah-session). This file is the package's defaults:
# copy a line to /etc/marah-launcher/session.conf to change it there, where package upgrades leave it.
# It is read by the shell, so each line is NAME=value.

# The launcher to run.
MARAH_BIN=/usr/bin/marah-launcher
# gamescope's options. -e is its Steam mode: Marah Launcher switches between itself and a game with
# gamescope's focus atoms. The command line follows these and `--`.
MARAH_GAMESCOPE_ARGS="-e --xwayland-count 1"
# Seconds to wait for Marah Launcher's "window shown" line before starting it again.
MARAH_WATCHDOG=90
# Seconds after Marah Launcher ends, once it wrote "log out", before logind ends the Marah Launcher session if the
# display server hasn't ended by itself (gamescope can hang on its way out). Outside a Marah Launcher
# login session (no logind, or started from a desktop's terminal), the session ends the display
# server itself.
MARAH_LOGOUT_GRACE=3
# Seconds to wait for the network at the start, so the first downloads don't fail.
MARAH_WAIT_NETWORK=5
# Where the session and Marah Launcher write their output.
MARAH_LOG="${XDG_CACHE_HOME:-$HOME/.cache}/marah-session.log"
# Megabytes the log may reach before the session starts a new one: the one before is kept as
# marah-session.previous.log.
MARAH_LOG_MAX_MB=10
