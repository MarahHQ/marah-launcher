# The deb, rpm and Arch packages, with nfpm (https://nfpm.goreleaser.com), from the Linux folder
# scripts/package.sh made. Nothing is compiled again. build-packages.sh runs it once per format
# with these set:
#   FOLDER    the release folder, dist/marah-launcher-linux-x86_64
#   VERSION   the version, without a leading v
#   PACKAGED  a file holding the format (deb, rpm or arch): /usr/lib/marah-launcher/packaged, which tells
#             Marah Launcher it was installed this way and updates through the package manager
name: marah-launcher
arch: amd64
platform: linux
version: ${VERSION}
version_schema: semver
release: 1
section: games
priority: optional
maintainer: Marah Launcher <https://github.com/MarahHQ/marah-launcher>
homepage: https://github.com/MarahHQ/marah-launcher
license: GPL-3.0-or-later
description: |
  A game launcher for PS5, PS4 and PC games, made for a TV and a controller.
  It plays PS5 games with KytyPS5, PS4 games with shadPS4, and PC games natively or through
  Wine or Proton. With gamescope it is also a session of its own, without a desktop: choose
  "Marah Launcher" at the login screen.

contents:
  # The release folder as it is: Marah Launcher finds its libraries and extensions beside the binary.
  - src: ${FOLDER}/marah-launcher
    dst: /usr/lib/marah-launcher/marah-launcher
    expand: true
    file_info:
      mode: 0755
  - src: ${FOLDER}/lib
    dst: /usr/lib/marah-launcher/lib
    type: tree
    expand: true
  - src: ${FOLDER}/licenses
    dst: /usr/lib/marah-launcher/licenses
    type: tree
    expand: true
  - src: ${FOLDER}/LICENSE
    dst: /usr/lib/marah-launcher/LICENSE
    expand: true
  - dst: /usr/lib/marah-launcher/extensions
    type: dir
  - src: ${PACKAGED}
    dst: /usr/lib/marah-launcher/packaged
    expand: true
  - src: /usr/lib/marah-launcher/marah-launcher
    dst: /usr/bin/marah-launcher
    type: symlink
  - src: packaging/linux/marah-session
    dst: /usr/bin/marah-session
    file_info:
      mode: 0755
  - src: packaging/linux/session.conf
    dst: /usr/share/marah-launcher/session.conf
  - src: packaging/linux/marah-launcher.desktop
    dst: /usr/share/applications/marah-launcher.desktop
  - src: packaging/linux/marah-session.desktop
    dst: /usr/share/wayland-sessions/marah-launcher.desktop
  # Mounting a drive inside the PC from the Drives panel without a password (see the file).
  - src: packaging/linux/drives.rules
    dst: /usr/share/polkit-1/rules.d/50-marah-launcher-drives.rules
  - src: assets/marah-launcher.png
    dst: /usr/share/icons/hicolor/512x512/apps/marah-launcher.png
  - src: ${FOLDER}/README.md
    dst: /usr/share/doc/marah-launcher/README.md
    expand: true

# What Marah Launcher links and loads at run time (sound, fonts, controllers, the window, Vulkan for This
# PC), the tools it runs to bring games to the front (ps, xdotool, xprop), what old Linux games'
# own launchers need (GTK 2, and libpng 1.2 where the system has it: Trine 3's GOG start.sh runs
# Frozenbyte's launcher), and, recommended, the session's display servers, the tools of
# Settings → System (NetworkManager, BlueZ, pactl), UDisks for the Drives panel, and unar,
# for the RAR archives libarchive can't read (a RAR 5 with a big dictionary, as in Cuphead's
# installer), Steam (the Steam plugin's games; not in the distributions' main repositories, so
# only recommended) and
# GameMode (games run through gamemoderun). Debian, Ubuntu and Arch have no libpng 1.2
# package (Arch's is in the AUR). Only the rpm depends on the 32-bit libraries that a game's own
# 32-bit Wine needs: Debian and Ubuntu need the i386 architecture added first, Arch the multilib
# repository.
overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      - libasound2 | libasound2t64
      - libfontconfig1
      - libudev1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libegl1
      - procps
      - xdotool
      - x11-utils
      - libgtk2.0-0t64 | libgtk2.0-0
      # The trailer player's libmpv (build-packages.sh leaves the bundled one out).
      - libmpv2 | libmpv1
    recommends:
      - gamescope
      - cage
      - libvulkan1
      - network-manager
      - bluez
      - pulseaudio-utils
      - unar
      # The Drives panel: mounting and ejecting drives.
      - udisks2
      # Steam's games (the Steam plugin), and GameMode for every game.
      - steam-installer | steam
      - gamemode
      # The sandbox a Windows game runs in (bwrap).
      - bubblewrap
  rpm:
    depends:
      - glibc >= 2.35
      - alsa-lib
      - fontconfig
      - systemd-libs
      - libxkbcommon
      - libxkbcommon-x11
      - libglvnd-egl
      - procps-ng
      - xdotool
      - xprop
      - gtk2
      - libpng12
      # The trailer player's libmpv (build-packages.sh leaves the bundled one out).
      - mpv-libs
      # 32-bit libraries, for a game that brings its own 32-bit Wine (a portable Wine wrapper):
      # the C library, X11 for its window, OpenGL and Vulkan, sound and fonts.
      - glibc(x86-32)
      - libgcc(x86-32)
      - libX11(x86-32)
      - libXext(x86-32)
      - libXcomposite(x86-32)
      - libXcursor(x86-32)
      - libXfixes(x86-32)
      - libXinerama(x86-32)
      - libXi(x86-32)
      - libXrandr(x86-32)
      - libXrender(x86-32)
      - libXxf86vm(x86-32)
      - mesa-libGL(x86-32)
      - mesa-dri-drivers(x86-32)
      - mesa-vulkan-drivers(x86-32)
      - vulkan-loader(x86-32)
      - alsa-lib(x86-32)
      - pulseaudio-libs(x86-32)
      - freetype(x86-32)
      - fontconfig(x86-32)
    recommends:
      - gamescope
      - cage
      - vulkan-loader
      - NetworkManager
      - bluez
      - pulseaudio-utils
      - unar
      # The Drives panel: mounting and ejecting drives.
      - udisks2
      # Steam's games (the Steam plugin; RPM Fusion's nonfree repository), and GameMode.
      - steam
      - gamemode
      # The sandbox a Windows game runs in (bwrap).
      - bubblewrap
  archlinux:
    depends:
      - glibc
      - alsa-lib
      - fontconfig
      - systemd-libs
      - libxkbcommon
      - libxkbcommon-x11
      - libglvnd
      - procps-ng
      - xdotool
      - xorg-xprop
      - gtk2
      # The trailer player's libmpv (build-packages.sh leaves the bundled one out).
      - mpv
    # Arch's optional dependencies.
    suggests:
      - gamescope
      - cage
      - vulkan-icd-loader
      - networkmanager
      - bluez-utils
      - libpulse
      - unarchiver
      # The Drives panel: mounting and ejecting drives.
      - udisks2
      # Steam's games (the Steam plugin; the multilib repository), and GameMode.
      - steam
      - gamemode
      # The sandbox a Windows game runs in (bwrap).
      - bubblewrap
